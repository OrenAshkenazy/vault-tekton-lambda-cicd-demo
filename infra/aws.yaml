AWSTemplateFormatVersion: "2010-09-09"
Description: Minimal AWS resources for the Vault and Tekton AssumeRole demo.

Parameters:
  BucketName:
    Type: String

Resources:
  DemoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DemoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DemoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DemoBucket.Arn
              - !Sub "${DemoBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketName}-deployments"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DeploymentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DeploymentBucket.Arn
              - !Sub "${DeploymentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  VaultBootstrapUser:
    Type: AWS::IAM::User
    Properties:
      UserName: vault-tekton-demo-bootstrap

  CameraUploaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VaultTektonDemoCameraUploader
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt VaultBootstrapUser.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOnlyEventsPrefix
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOnlyEventsPrefix
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DemoBucket.Arn}/events/*"

  ImageProcessorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VaultTektonDemoImageProcessorExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOnlyProcessorLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vault-tekton-image-processor:*"

  LambdaDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VaultTektonDemoLambdaDeployer
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt VaultBootstrapUser.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeployOnlyDemoImageProcessor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageDemoStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:SetStackPolicy
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/vault-tekton-image-processor-demo/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/vault-tekton-image-processor-demo-change-set/*"
              - Sid: ValidateTemplateAndListStacks
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: UseDeploymentBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt DeploymentBucket.Arn
              - Sid: ManageDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DeploymentBucket.Arn}/serverless/*"
              - Sid: ManageDemoFunctions
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:vault-tekton-image-processor"
              - Sid: ManageDemoEventRule
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:DisableRule
                  - events:EnableRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/vault-tekton-image-processor-rule-1"
              - Sid: PassOnlyProcessorExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ImageProcessorExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ReadProcessorLogs
                Effect: Allow
                Action: logs:FilterLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vault-tekton-image-processor:*"
              - Sid: ManageProcessorLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vault-tekton-image-processor:*"

  VaultBootstrapPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: VaultTektonDemoBootstrap
      Users:
        - !Ref VaultBootstrapUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeOnlyDemoRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource:
              - !GetAtt CameraUploaderRole.Arn
              - !GetAtt LambdaDeployerRole.Arn
          - Sid: RotateOwnAccessKey
            Effect: Allow
            Action:
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:GetUser
              - iam:ListAccessKeys
            Resource: !GetAtt VaultBootstrapUser.Arn

Outputs:
  BucketName:
    Value: !Ref DemoBucket
  DeploymentBucketName:
    Value: !Ref DeploymentBucket
  CameraUploaderRoleArn:
    Value: !GetAtt CameraUploaderRole.Arn
  LambdaDeployerRoleArn:
    Value: !GetAtt LambdaDeployerRole.Arn
  ImageProcessorExecutionRoleArn:
    Value: !GetAtt ImageProcessorExecutionRole.Arn
  VaultBootstrapUserName:
    Value: !Ref VaultBootstrapUser
