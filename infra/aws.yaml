AWSTemplateFormatVersion: "2010-09-09"
Description: AWS foundation for the Vault-authenticated Tekton Lambda CI/CD demo.

Parameters:
  DeploymentBucketName:
    Type: String

Resources:
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DeploymentBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DeploymentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeploymentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DeploymentBucket.Arn
              - !Sub "${DeploymentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  VaultBootstrapUser:
    Type: AWS::IAM::User
    Properties:
      UserName: vault-tekton-lambda-cicd-bootstrap

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VaultTektonLambdaCICDExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOnlyLambdaLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vault-tekton-lambda-cicd:*"

  LambdaDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VaultTektonLambdaCICDDeployer
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt VaultBootstrapUser.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeployOnlyDemoLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageDemoStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:SetStackPolicy
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                  - cloudformation:UpdateStack
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/vault-tekton-lambda-cicd-demo/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/vault-tekton-lambda-cicd-demo-change-set/*"
              - Sid: ValidateTemplateAndListStacks
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: UseDeploymentBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt DeploymentBucket.Arn
              - Sid: ManageDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DeploymentBucket.Arn}/serverless/*"
              - Sid: ManageAndInvokeDemoLambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:InvokeFunction
                  - lambda:ListTags
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:vault-tekton-lambda-cicd"
              - Sid: PassOnlyLambdaExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt LambdaExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ManageLambdaLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vault-tekton-lambda-cicd:*"

  VaultBootstrapPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: VaultTektonLambdaCICDBootstrap
      Users:
        - !Ref VaultBootstrapUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeOnlyLambdaDeployer
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt LambdaDeployerRole.Arn
          - Sid: RotateOwnAccessKey
            Effect: Allow
            Action:
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:GetUser
              - iam:ListAccessKeys
            Resource: !GetAtt VaultBootstrapUser.Arn

Outputs:
  DeploymentBucketName:
    Value: !Ref DeploymentBucket
  LambdaDeployerRoleArn:
    Value: !GetAtt LambdaDeployerRole.Arn
  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
  VaultBootstrapUserName:
    Value: !Ref VaultBootstrapUser
