apiVersion: v1
kind: Namespace
metadata:
  name: vault-tekton-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-ci
  namespace: vault-tekton-demo
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-trigger
  namespace: vault-tekton-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-tekton-demo-token-review
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-trigger-eventlistener
  namespace: vault-tekton-demo
subjects:
  - kind: ServiceAccount
    name: github-trigger
    namespace: vault-tekton-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-tekton-demo-eventlistener-cluster
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["clusterinterceptors", "clustertriggerbindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-trigger-eventlistener
subjects:
  - kind: ServiceAccount
    name: github-trigger
    namespace: vault-tekton-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-tekton-demo-eventlistener-cluster
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: lambda-cicd
  namespace: vault-tekton-demo
spec:
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
  workspaces:
    - name: source
  tasks:
    - name: fetch-source
      taskSpec:
        params:
          - name: git-url
            type: string
          - name: git-revision
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: vault-tekton-demo:local
            env:
              - name: GIT_TERMINAL_PROMPT
                value: "0"
              - name: GIT_URL
                value: $(params.git-url)
              - name: GIT_REVISION
                value: $(params.git-revision)
            script: |
              #!/bin/bash
              set -euo pipefail
              [[ "${GIT_REVISION}" =~ ^[0-9a-f]{40}$ ]]
              repo_dir="$(workspaces.source.path)/repo"
              git init "${repo_dir}"
              git -C "${repo_dir}" remote add origin "${GIT_URL}"
              git -C "${repo_dir}" fetch --depth=1 origin "${GIT_REVISION}"
              git -C "${repo_dir}" checkout --detach FETCH_HEAD
              actual_revision="$(git -C "${repo_dir}" rev-parse HEAD)"
              [[ "${actual_revision}" == "${GIT_REVISION}" ]]
              printf 'PROOF checked out Git revision %s: PASS\n' "${actual_revision}"
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: source

    - name: test-lambda
      runAfter: [fetch-source]
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: test
            image: vault-tekton-demo:local
            workingDir: $(workspaces.source.path)/repo
            script: |
              #!/bin/bash
              set -euo pipefail
              python3 test/handler.py
              ./test/deploy.sh
              echo 'PROOF Lambda CI checks: PASS'
      workspaces:
        - name: source
          workspace: source

    - name: deploy-and-verify
      runAfter: [test-lambda]
      taskSpec:
        params:
          - name: git-revision
            type: string
        workspaces:
          - name: source
        volumes:
          - name: vault-jwt
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    audience: vault
                    expirationSeconds: 600
        steps:
          - name: deploy
            image: vault-tekton-demo:local
            volumeMounts:
              - name: vault-jwt
                mountPath: /var/run/secrets/vault
                readOnly: true
            env:
              - name: AWS_EC2_METADATA_DISABLED
                value: "true"
              - name: SLS_TELEMETRY_DISABLED
                value: "1"
              - name: VAULT_ADDR
                value: http://vault.vault.svc:8200
              - name: SERVICE_ACCOUNT_TOKEN_FILE
                value: /var/run/secrets/vault/token
              - name: AWS_REGION
                valueFrom:
                  configMapKeyRef:
                    name: lambda-cicd-config
                    key: aws-region
              - name: DEPLOYMENT_BUCKET
                valueFrom:
                  configMapKeyRef:
                    name: lambda-cicd-config
                    key: deployment-bucket
              - name: LAMBDA_EXECUTION_ROLE_ARN
                valueFrom:
                  configMapKeyRef:
                    name: lambda-cicd-config
                    key: lambda-execution-role-arn
              - name: SOURCE_DIR
                value: $(workspaces.source.path)/repo
              - name: SERVERLESS_TEMPLATE
                value: /opt/lambda-template/serverless.yml
              - name: GIT_SHA
                value: $(params.git-revision)
            script: |
              #!/bin/bash
              set -euo pipefail
              /usr/local/bin/deploy-lambda
      params:
        - name: git-revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: source
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-release
  namespace: vault-tekton-demo
spec:
  params:
    - name: git-url
      value: https://github.com/OrenAshkenazy/vault-tekton-lambda-cicd-demo.git
    - name: git-revision
      value: $(body.after)
    - name: git-ref
      value: $(body.ref)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: lambda-cicd
  namespace: vault-tekton-demo
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: git-ref
  resourceTemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: lambda-cicd-
        namespace: vault-tekton-demo
        labels:
          app.kubernetes.io/part-of: vault-tekton-lambda-cicd
          demo.git.sha: $(tt.params.git-revision)
        annotations:
          demo.git.ref: $(tt.params.git-ref)
      spec:
        pipelineRef:
          name: lambda-cicd
        taskRunTemplate:
          serviceAccountName: tekton-ci
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 100Mi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-release
  namespace: vault-tekton-demo
spec:
  serviceAccountName: github-trigger
  triggers:
    - name: demo-tag
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                header.match('X-GitHub-Event', 'push') &&
                body.ref.startsWith('refs/tags/demo-') &&
                body.repository.full_name == 'OrenAshkenazy/vault-tekton-lambda-cicd-demo'
      bindings:
        - ref: github-release
      template:
        ref: lambda-cicd
